# Which engines run, how much and how they score. Weights in each block must sum to 100.

money_sweep:
  enabled: true
  cadence: quarterly           # full sweep at onboarding, then quarterly; receivables weekly              # daily | weekly | monthly
  states_lived_or_worked: [IL, OH]   # e.g. ["NY", "CA"]
  countries: [US]      # e.g. ["US"]
  former_names: []
  past_employers_with_plans: []
  left_corporate_on: ""        # YYYY-MM-DD; turns on the corporate exit audit for 24 months

grant_hunter:
  enabled: false               # opt-in: grants rarely fund a solo practice (the SBA says it does not fund starting a business)
  cadence: weekly
  per_run_target: 4
  min_score: 60
  weights: {fit: 30, value: 25, odds: 20, effort: 15, urgency: 10}
  focus: []                    # e.g. ["AI for work", "women-owned", "New York small business"]
  equity_ok: false

project_hunter:
  enabled: true
  cadence: daily
  per_run_target: 8
  min_score: 60
  weights: {fit: 30, value: 25, warm_path: 20, speed_to_cash: 15, effort: 10}
  engagement_types: [advisory, fractional, project, workshop]       # advisory | fractional | project | workshop | speaking | expert_calls | subcontract | rfp
  day_rate_usd: 2500
  project_minimum_usd: 15000

job_insurance:
  enabled: false
  cadence: daily
  daily_cap: 5
  min_score: 60
  weights: {fit: 40, level: 20, domain: 15, constraints: 15, comp: 10}
  titles: []
  adjacent_titles: []
  target_companies: []

network:
  enabled: true
  rebuild: monthly             # rebuild the index when a fresh LinkedIn export lands
  max_drafts_per_day: 5        # reconnection and intro drafts across all lanes; maximum 5
  connector_income: false      # recruiting referrals, partner referrals, venture scouting (opt-in)

today:
  enabled: true
  focus_mode: false            # extra structure: 3 items, a 10-minute starter first, new items parked, carryovers decided
  human_minutes_per_day: 45    # your time budget for presses, decisions and calls
  max_items: 7                 # focus mode forces 3
  default_deal_usd: 0          # used only to rank items with no stated amount; 0 = project minimum or 3 day rates
  follow_up_days: 5            # Claude drafts a follow-up when a sent item gets no reply for this many days

autopilot:
  digest_time: "08:00"
  max_drafts_per_run: 8
  max_forms_filled_per_run: 5
  approval: draft_only         # the only supported value: nothing is sent or submitted without the user's yes
