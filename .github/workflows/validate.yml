name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/validate_skills.py
      - run: python3 -m unittest discover tests
      - run: |
          python3 skills/comeback-setup/scripts/validate_pack.py examples/sample-workspace --export /tmp/pack.json
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('/tmp/pack.json')), json.load(open('schemas/context-pack.schema.json'))); print('schema OK')"
